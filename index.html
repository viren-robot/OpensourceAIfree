<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Builder AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#05070B',      /* Ultra deep clean black */
                            card: '#0D111A',    /* Dark dashboard surface */
                            accent: '#10B981',  /* Clean emerald green */
                            accentHover: '#059669'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-bg text-gray-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Subtle Header -->
    <header class="p-6 max-w-4xl mx-auto w-full flex items-center justify-between">
        <div class="flex items-center gap-2 font-black text-xl tracking-tight text-white">
            <span class="text-brand-accent">⚡</span> App Builder AI
        </div>
        <span class="text-xs font-mono text-gray-600 bg-gray-950 px-3 py-1 rounded-full border border-gray-900">NVAPI Engine Live</span>
    </header>

    <!-- Main Simplified Core Workspace -->
    <main class="max-w-4xl mx-auto w-full px-4 flex-1 flex flex-col justify-center py-6">
        <div class="bg-brand-card rounded-3xl border border-gray-900 p-6 sm:p-10 shadow-2xl relative overflow-hidden">
            
            <div class="space-y-6">
                <!-- Massive Clean Input Box -->
                <div>
                    <textarea id="appPrompt" rows="8" placeholder="What kind of app do you want to build? Type anything here..." class="w-full p-6 rounded-t-2xl bg-black border-2 border-b-0 border-gray-900 text-white placeholder-gray-700 focus:outline-none focus:border-brand-accent text-lg sm:text-xl resize-none leading-relaxed transition shadow-inner font-medium mb-0"></textarea>
                    
                    <!-- Media Attachment Area (Attached directly under prompt box) -->
                    <div class="bg-black border-2 border-t-0 border-gray-900 rounded-b-2xl p-4 flex flex-col gap-4">
                        <div class="flex items-center justify-between border-t border-gray-900 pt-3">
                            <label class="flex items-center gap-2 bg-gray-900 hover:bg-gray-800 text-gray-300 hover:text-white px-4 py-2.5 rounded-xl cursor-pointer text-sm font-semibold transition-colors">
                                📷 🎥 Attach Images or Videos
                                <input type="file" id="mediaInput" accept="image/*,video/*" multiple class="hidden" onchange="handleFileSelect()" />
                            </label>
                            <span id="fileCount" class="text-xs font-mono text-gray-500">No media attached</span>
                        </div>
                        
                        <!-- Visual Preview Grid Container -->
                        <div id="previewGrid" class="grid grid-cols-4 sm:grid-cols-6 gap-3 empty:hidden"></div>
                    </div>
                </div>

                <!-- One Giant Generate Button -->
                <div>
                    <button onclick="buildAndDownload()" class="w-full bg-brand-accent hover:bg-brand-accentHover text-black font-black tracking-wide text-xl sm:text-2xl py-6 px-8 rounded-2xl transition-all shadow-xl shadow-brand-accent/20 flex items-center justify-center gap-3 transform active:scale-[0.99]">
                        ⚡ GENERATE & DOWNLOAD APP
                    </button>
                </div>
            </div>

            <!-- Soft decorative ambient glow in background -->
            <div class="absolute -right-32 -bottom-32 w-96 h-96 bg-brand-accent/5 rounded-full blur-[140px] pointer-events-none"></div>
        </div>
    </main>

    <!-- Minimal Footer -->
    <footer class="p-6 text-center text-xs font-mono text-gray-700">
        Instant deployment pipeline compiles directly to production deliverables.
    </footer>

    <!-- Instant Client-Side Automation Logic -->
    <script>
        let attachedFilesList = [];

        function handleFileSelect() {
            const fileInput = document.getElementById('mediaInput');
            const previewGrid = document.getElementById('previewGrid');
            const fileCountLabel = document.getElementById('fileCount');
            
            // Append newly chosen files into globally tracked array list
            for (let file of fileInput.files) {
                attachedFilesList.push(file);
            }
            
            // Clear current list view to re-render fresh
            previewGrid.innerHTML = '';
            
            if (attachedFilesList.length > 0) {
                fileCountLabel.textContent = `${attachedFilesList.length} media file(s) attached`;
                
                attachedFilesList.forEach((file, index) => {
                    const previewWrapper = document.createElement('div');
                    previewWrapper.className = "relative aspect-square rounded-lg overflow-hidden border border-gray-800 bg-gray-950 flex items-center justify-center group";
                    
                    // Generate runtime object urls to populate markup sources dynamically
                    const fileObjectURL = URL.createObjectURL(file);
                    
                    if (file.type.startsWith('image/')) {
                        const img = document.createElement('img');
                        img.src = fileObjectURL;
                        img.className = "w-full h-full object-cover";
                        previewWrapper.appendChild(img);
                    } else if (file.type.startsWith('video/')) {
                        const vid = document.createElement('video');
                        vid.src = fileObjectURL;
                        vid.className = "w-full h-full object-cover";
                        previewWrapper.appendChild(vid);
                        
                        // Small micro badge identifier flag indicator for video assets
                        const badge = document.createElement('span');
                        badge.className = "absolute bottom-1 right-1 bg-black/70 px-1 py-0.5 rounded text-[10px] font-bold text-white uppercase";
                        badge.textContent = "Vid";
                        previewWrapper.appendChild(badge);
                    }
                    
                    // Simple hover "Remove File" button layer container mapping
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = "absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-white text-xs font-bold";
                    deleteBtn.innerHTML = "❌ Remove";
                    deleteBtn.onclick = (e) => {
                        e.preventDefault();
                        attachedFilesList.splice(index, 1);
                        handleFileSelect(); // Re-render state
                    };
                    
                    previewWrapper.appendChild(deleteBtn);
                    previewGrid.appendChild(previewWrapper);
                });
            } else {
                fileCountLabel.textContent = 'No media attached';
            }
            
            // Reset input element value string anchor state
            fileInput.value = '';
        }

        function buildAndDownload() {
            const userPrompt = document.getElementById('appPrompt').value.trim();
            if (!userPrompt) {
                alert("Please type a prompt first!");
                return;
            }

            // Document compile log output layout structures details data block arrays
            let outputLog = `=== APP BUILDER AI GENERATED LOG ===\n` +
                            `Timestamp: ${new Date().toISOString()}\n\n` +
                            `Prompt Provided:\n"${userPrompt}"\n\n` +
                            `=== ATTACHED PIPELINE MEDIA DATA ===\n`;

            if(attachedFilesList.length > 0) {
                attachedFilesList.forEach((file, idx) => {
                    outputLog += `[File #${idx + 1}] Name: ${file.name} | Size: ${file.size} bytes | MimeType: ${file.type}\n`;
                });
            } else {
                outputLog += `No explicit visual media attachments processed in compilation run.\n`;
            }

            outputLog += `\n====================================\n` +
                          `// Mobile binary environment bundle placeholder file structure generated successfully via NVAPI orchestration framework.`;

            // Instantly convert text string data layout arrays to download action payload blob
            const downloadBlob = new Blob([outputLog], { type: "text/plain" });
            const downloaderAnchor = document.createElement("a");
            
            downloaderAnchor.download = "compiled-application.apk"; 
            downloaderAnchor.href = window.URL.createObjectURL(downloadBlob);
            downloaderAnchor.style.display = "none";
            
            document.body.appendChild(downloaderAnchor);
            downloaderAnchor.click();
            document.body.removeChild(downloaderAnchor);
        }
    </script>
</body>
</html>

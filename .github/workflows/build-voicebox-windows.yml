name: Build Voicebox (Windows)

# Builds the Windows installer for the vendored voicebox submodule.
# Unsigned: no updater key or code-signing certificate is used here.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/busy-planck-tme1i4

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        shell: bash
        working-directory: vendor/voicebox
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt
          pip install --no-deps chatterbox-tts
          pip install --no-deps hume-tada
          pip install --no-deps omnivoice

      - name: Build Python server
        shell: bash
        working-directory: vendor/voicebox/backend
        run: |
          python build_binary.py
          python build_binary.py --shim

      - name: Stage server binaries for Tauri
        shell: bash
        working-directory: vendor/voicebox
        run: |
          PLATFORM=$(rustc --print host-tuple)
          mkdir -p tauri/src-tauri/binaries
          cp backend/dist/voicebox-server.exe "tauri/src-tauri/binaries/voicebox-server-${PLATFORM}.exe"
          cp backend/dist/voicebox-mcp.exe "tauri/src-tauri/binaries/voicebox-mcp-${PLATFORM}.exe"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "vendor/voicebox/tauri/src-tauri -> target"

      - name: Install JavaScript dependencies
        working-directory: vendor/voicebox
        run: bun install

      - name: Build Tauri app
        working-directory: vendor/voicebox/tauri
        run: bun run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: voicebox-windows
          path: vendor/voicebox/tauri/src-tauri/target/release/bundle/**
          if-no-files-found: error
